<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="132" viewBox="0 0 1000 132" role="img" aria-label="Resultados medidos: 40 por ciento menos de tiempo de inferencia, 70 por ciento menos de tiempo de inspección, 13 de 14 en conjunto reservado, más de 1000 imágenes al día">
  <defs>
    <linearGradient id="reglaAcento" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2f81f7" stop-opacity="0"/>
      <stop offset="50%" stop-color="#2f81f7" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#2f81f7" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect x="0.5" y="0.5" width="999" height="131" rx="14" fill="#0d1117" stroke="#21262d"/>

  <g stroke="#21262d" stroke-width="1">
    <line x1="250" y1="30" x2="250" y2="102"/>
    <line x1="500" y1="30" x2="500" y2="102"/>
    <line x1="750" y1="30" x2="750" y2="102"/>
  </g>

  <g font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" text-anchor="middle">
    <g>
      <text x="125" y="63" font-size="34" font-weight="700" fill="#f0f6fc">&#8722;40 %</text>
      <text x="125" y="87" font-size="13.5" fill="#8b949e">tiempo de inferencia</text>
      <text x="125" y="106" font-size="11" fill="#6e7681">OpenVINO · Tecondor</text>
    </g>
    <g>
      <text x="375" y="63" font-size="34" font-weight="700" fill="#f0f6fc">&#8722;70 %</text>
      <text x="375" y="87" font-size="13.5" fill="#8b949e">tiempo de inspección</text>
      <text x="375" y="106" font-size="11" fill="#6e7681">Mesa de calidad · Capiro</text>
    </g>
    <g>
      <text x="625" y="63" font-size="34" font-weight="700" fill="#f0f6fc">13<tspan fill="#484f58">/</tspan>14</text>
      <text x="625" y="87" font-size="13.5" fill="#8b949e">conjunto reservado</text>
      <text x="625" y="106" font-size="11" fill="#6e7681">auditable-kyc-agent</text>
    </g>
    <g>
      <text x="875" y="63" font-size="34" font-weight="700" fill="#f0f6fc">+1.000</text>
      <text x="875" y="87" font-size="13.5" fill="#8b949e">imágenes al día</text>
      <text x="875" y="106" font-size="11" fill="#6e7681">FastAPI + AsyncIO · Capiro</text>
    </g>
  </g>

  <rect x="200" y="129" width="600" height="2" fill="url(#reglaAcento)"/>
